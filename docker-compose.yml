services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paylink_dev}
      POSTGRES_DB: paylink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink -d paylink"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://paylink:${POSTGRES_PASSWORD:-paylink_dev}@db:5432/paylink
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
